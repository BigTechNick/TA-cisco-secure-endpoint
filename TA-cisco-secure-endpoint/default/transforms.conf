# TA-cisco-secure-endpoint

# object_attrs: the attribute names in old_attributes / new_attributes of an audit log record
# (the API writes them as text, e.g. "{'name': 'Wave 2'}"), one value per attribute.
[cisco_se_object_attrs]
SOURCE_KEY = _raw
REGEX = '([A-Za-z_][A-Za-z0-9_]{0,63})':\s
FORMAT = object_attrs::$1
MV_ADD = true
