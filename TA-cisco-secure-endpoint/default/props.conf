# TA-cisco-secure-endpoint

# ---------------------------------------------------------------- cisco:se
# Events, compromises, computers, vulnerabilities and top malware threats: the API's JSON plus
# EndpointDataType, the format the Cisco Security Cloud app writes, so its field extractions and CIM
# mappings for cisco:se apply where it is installed. KV_MODE = json so the fields also work without it.
# _time comes from the input (event timestamp; collection time for snapshots).
[cisco:se]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 500000
KV_MODE = json

# ---------------------------------------------------------------- cisco:se:audit
# Audit logs (/v1/audit_logs), with CIM mappings: Authentication (console sign-ins), Change:
# Account_Management (users, API credentials), Change: Endpoint_Changes (computers, isolation, scans,
# fetched files, endpoint IOC scans) and Change (policies, groups, exclusions, detections, ...).
[cisco:se:audit]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 100000
TIME_PREFIX = "created_at":\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S
TZ = UTC
MAX_TIMESTAMP_LOOKAHEAD = 32
KV_MODE = json
EVAL-vendor = "Cisco"
EVAL-product = "Secure Endpoint"
EVAL-vendor_product = "Cisco Secure Endpoint"
EVAL-app = "Cisco Secure Endpoint"
EVAL-dvc = host
EVAL-action = case(match(event, "(?i)login|logon|sign_?in"), if(match(event, "(?i)fail|denied|error"), "failure", "success"), match(event, "(?i)(^|_)(create|add)"), "created", match(event, "(?i)delete|destroy|remove"), "deleted", match(event, "(?i)isolation_start"), "created", match(event, "(?i)stop"), "stopped", true(), "modified")
EVAL-status = if(match(event, "(?i)fail|denied|error"), "failure", "success")
EVAL-result = coalesce(message, event)
EVAL-signature = audit_log_type . " " . event
EVAL-change_type = case(match(event, "(?i)login|logon|sign_?in"), null(), in(audit_log_type, "User", "ApiCredential"), "AAA", in(audit_log_type, "Computer", "IsolationSession", "ScanRequest", "FetchedFile", "OpenIocScan"), "endpoint", true(), "configuration")
EVAL-object = item
EVAL-object_id = audit_log_id
EVAL-object_category = lower(replace(replace(audit_log_type, "::", "_"), "([a-z0-9])([A-Z])", "\1_\2"))
# Authentication: user = the account that signed in. Account changes: user = the account changed,
# src_user = the administrator. Other changes: user = the administrator (unknown = made by the system).
EVAL-user = case(match(event, "(?i)login|logon|sign_?in"), coalesce(audit_log_user, item), in(audit_log_type, "User", "ApiCredential"), coalesce(item, "unknown"), true(), coalesce(audit_log_user, "unknown"))
EVAL-src_user = if(in(audit_log_type, "User", "ApiCredential") AND NOT match(event, "(?i)login|logon|sign_?in"), coalesce(audit_log_user, "unknown"), null())
EVAL-dest = case(match(event, "(?i)login|logon|sign_?in"), "Cisco Secure Endpoint", in(audit_log_type, "Computer", "IsolationSession", "ScanRequest", "FetchedFile", "OpenIocScan"), item, true(), host)
EVAL-description = coalesce(message, audit_log_type . " " . event . " " . item)
REPORT-cisco_se_object_attrs = cisco_se_object_attrs
EVAL-object_attrs = mvdedup(object_attrs)

# ---------------------------------------------------------------- collector logs
# $SPLUNK_HOME/var/log/splunk/cisco_se_<input>.log -> index _internal
[source::.../var/log/splunk/cisco_se_*.log*]
priority = 10
sourcetype = cisco:se:ta:log

# $SPLUNK_HOME/var/log/splunk/cisco_se-webapi.log (Inputs page actions)
[source::.../var/log/splunk/cisco_se-webapi.log*]
priority = 10
sourcetype = cisco:se:ta:webapi

[cisco:se:ta:log]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)(?=\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3} )
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%d %H:%M:%S,%3N
MAX_TIMESTAMP_LOOKAHEAD = 23
TRUNCATE = 20000
EXTRACT-cisco_se_input = cisco_se_(?<input>[^\\/]+?)\.log(?:\.\d+)?$ in source
EXTRACT-cisco_se_line = ^\S+ \S+ (?<log_level>DEBUG|INFO|WARNING|ERROR|CRITICAL) (?<message>.*)
EXTRACT-cisco_se_run = run (?<run_result>done|failed|skipped|stopped):
EXTRACT-cisco_se_type = ^\S+ \S+ [A-Z]+ (?<type_result>collected|failed) (?<data_type>events|audit|compromises|metrics|computers|vulnerabilities): 
EXTRACT-cisco_se_written = (?:collected [a-z]+|run done): written (?<written>\d+)
EXTRACT-cisco_se_duplicates = , duplicates (?<duplicates>\d+)
EXTRACT-cisco_se_api_calls = , api calls (?<api_calls>\d+)
EXTRACT-cisco_se_behind = behind (?<behind_min>-?[\d.]+) min
EXTRACT-cisco_se_newest = newest (?<newest_min>-?[\d.]+) min ago
EXTRACT-cisco_se_duration = , (?<duration_sec>[\d.]+) s$

[cisco:se:ta:webapi]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)(?=\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3} )
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%d %H:%M:%S,%3N
MAX_TIMESTAMP_LOOKAHEAD = 23
EXTRACT-cisco_se_webapi = ^\S+ \S+ (?<log_level>[A-Z]+) (?<message>.*)
