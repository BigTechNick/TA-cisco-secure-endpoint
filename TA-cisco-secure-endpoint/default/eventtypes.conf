# TA-cisco-secure-endpoint: CIM event types for cisco:se:audit (cisco:se is mapped by the Cisco Security Cloud app)

[cisco_se_audit]
search = sourcetype="cisco:se:audit"
description = Cisco Secure Endpoint audit logs

[cisco_se_authentication]
search = sourcetype="cisco:se:audit" (event="*login*" OR event="*logon*" OR event="*sign_in*" OR event="*signin*")
description = Cisco Secure Endpoint console sign-ins (CIM Authentication)

[cisco_se_account_change]
search = sourcetype="cisco:se:audit" audit_log_type IN ("User", "ApiCredential") NOT (event="*login*" OR event="*logon*" OR event="*sign_in*" OR event="*signin*")
description = Changes to Secure Endpoint users and API credentials (CIM Change: Account_Management)

[cisco_se_endpoint_change]
search = sourcetype="cisco:se:audit" audit_log_type IN ("Computer", "IsolationSession", "ScanRequest", "FetchedFile", "OpenIocScan")
description = Changes to computers: isolation, scans, fetched files, endpoint IOC scans (CIM Change: Endpoint_Changes)

[cisco_se_config_change]
search = sourcetype="cisco:se:audit" NOT audit_log_type IN ("User", "ApiCredential", "Computer", "IsolationSession", "ScanRequest", "FetchedFile", "OpenIocScan") NOT (event="*login*" OR event="*logon*" OR event="*sign_in*" OR event="*signin*")
description = Changes to policies, groups, exclusions, detections and other settings (CIM Change)
