# REST API used by the add-on's Inputs page (bin/cisco_se_rest.py)
[script:cisco_se_inputs]
match = /cisco_se/inputs
script = cisco_se_rest.py
scripttype = persist
handler = cisco_se_rest.Handler
requireAuthentication = true
output_modes = json
passPayload = true
passSession = true
passHttpHeaders = false
passHttpCookies = false
python.version = python3
python.required = 3.13,3.9

[script:cisco_se_accounts]
match = /cisco_se/accounts
script = cisco_se_rest.py
scripttype = persist
handler = cisco_se_rest.Handler
requireAuthentication = true
