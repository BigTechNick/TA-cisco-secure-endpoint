# TA-cisco-secure-endpoint
[install]
build = 1

[launcher]
author = Nikhil Chawla
description = Collects Cisco Secure Endpoint (AMP for Endpoints) events, audit logs, compromises, computers, vulnerabilities and top malware threats from the Secure Endpoint API, each selectable with its own schedule. Event types, audit log types and groups are picked from lists read live from the API (all, only selected, all except selected). Events use sourcetype cisco:se in the Cisco Security Cloud app's format; audit logs use cisco:se:audit with CIM mappings. Not affiliated with Cisco.
version = 1.0.0

[ui]
is_visible = true
label = Secure Endpoint (AMP) Events and Audit Logs Add-on for Cisco
supported_themes = light,dark

[package]
id = TA-cisco-secure-endpoint
check_for_updates = true

[id]
name = TA-cisco-secure-endpoint
version = 1.0.0
