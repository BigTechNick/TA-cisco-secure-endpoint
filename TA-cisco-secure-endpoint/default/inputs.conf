# Defaults for every input of this add-on. Inputs themselves are created in
# Splunk Web (the add-on's Inputs page, or Settings > Data inputs) and saved
# in this add-on's local/inputs.conf. Splunk starts each input every minute
# (interval); each data type is collected on its own schedule (<type>_every).
[cisco_secure_endpoint]
python.version = python3
python.required = 3.13,3.9
interval = 60
collect_events = 1
events_every = 5
collect_audit = 1
audit_every = 5
collect_compromises = 0
compromises_every = 60
collect_metrics = 0
metrics_every = 60
collect_computers = 0
computers_every = 1440
collect_vulnerabilities = 0
vulnerabilities_every = 1440
event_types_mode = all
event_types =
audit_types_mode = all
audit_types =
groups_mode = all
groups =
start_hours_ago = 24
overlap_minutes = 60
audit_overlap_minutes = 10
audit_delay_minutes = 2
page_size = 500
log_level = INFO
